<div class="profile-container">

  <!-- Fixed Header Section -->
  <div class="fixed-header">
    <!-- Back Button -->
    <div class="profile-header">
      <button class="back-btn" (click)="goToFeed()">Back to Feed</button>
    </div>

    <!-- User Info Card (Fixed) -->
    <div *ngIf="!isLoadingUser && userInfo" class="user-card">
      <div class="author-avatar">
        <img *ngIf="userInfo.profileLink" [src]="userInfo.profileLink || '/avatar/default-avatar.png'"
          [alt]="userInfo.username" class="profile-image">

      </div>
      <div class="user-details">
        <h1 class="user-name">{{ userInfo.firstname }} {{ userInfo.lastname }}</h1>
        <p class="user-username">@{{ userInfo.username }}</p>
        <p class="post-count">{{ posts.length }} {{ posts.length === 1 ? 'post' : 'posts' }}</p>
      </div>


      <div class="header-actions">
        <app-follow-button [username]="username" size="large"></app-follow-button>

        <div class="menu-container" *ngIf="!isCurrentUser()">
          <button class="menu-btn" (click)="toggleMenu($event)">⋮</button>
          <div class="menu-dropdown" [class.show]="showMenu">
            <button class="menu-item report-btn" (click)="onReportUser()">
            <fa-icon [icon]="faFlag" class="menu-icon"></fa-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading User Info -->
    <div *ngIf="isLoadingUser" class="loading">
      <p>Loading profile...</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error">
      <p>{{ errorMessage }}</p>
    </div>

    <!-- Posts Section Title -->
    <h2 class="section-title">Posts</h2>
  </div>

  <!-- Scrollable Posts Section -->
  <div class="posts-wrapper">
    <!-- Loading Posts -->
    <div *ngIf="isLoadingPosts" class="loading">
      <p>Loading posts...</p>
    </div>

    <!-- No Posts Message -->
    <div *ngIf="!isLoadingPosts && posts.length === 0 && !errorMessage" class="no-posts">
      <p>No posts yet.</p>
    </div>

    <!-- Posts List -->
    <div *ngIf="!isLoadingPosts && posts.length > 0" class="posts-list">
      <app-post-card *ngFor="let post of posts" [postResponse]="post"></app-post-card>
    </div>
  </div>
</div>
