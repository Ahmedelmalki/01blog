<!-- Single Post Card -->
<div class="post-card">

  <!-- Post header with author info -->
  <div class="post-header">
    <div class="author-info">
      <a [routerLink]="['/profile', postResponse.author]" class="author-link">
        <!-- Profile Picture -->
        <div class="author-avatar">
          <img *ngIf="postResponse.authorProfileLink" [src]="postResponse.authorProfileLink" [alt]="postResponse.author"
            class="profile-image">
          <div *ngIf="!postResponse.authorProfileLink" class="avatar-placeholder"
            [style.background-color]="avatarService.getAvatarColor(postResponse.author)">
            {{ avatarService.getInitial(postResponse.author) }}
          </div>
        </div>
      </a>
      <!-- todo: add follow-button -->
      <app-follow-button [username]="postResponse.author" size="small"></app-follow-button>
    </div>

    <!-- Three-dots menu button (show if user can modify OR report) -->
    <div class="menu-container" *ngIf="canModifyPost() || canReportPost()">
      <button class="menu-btn" (click)="toggleMenu($event)">⋮</button>

      <!-- Dropdown menu -->
      <div class="menu-dropdown" [class.show]="showMenu">
        <!-- Show Update/Delete if it's the user's own post -->
        <ng-container *ngIf="canModifyPost()">
          <button class="menu-item update-btn" (click)="onUpdate()">
            <fa-icon [icon]="faPen"></fa-icon>
            Update
          </button>
          <button class="menu-item delete-btn" (click)="onDelete()">
            <fa-icon [icon]="faTrash"></fa-icon>
            Delete
          </button>
        </ng-container>

        <!-- Show Report if it's NOT the user's post -->
        <ng-container *ngIf="canReportPost()">
          <button class="menu-item report-btn" (click)="onReport()">
            <fa-icon [icon]="faFlag" class="menu-icon"></fa-icon>
            Report
          </button>
        </ng-container>
      </div>
    </div>
  </div>


  <h2 class="post-title">{{ postResponse.title }}</h2>
  <p class="post-content">{{ postResponse.content }}</p>

  <div *ngIf="postResponse.mediaLink" class="post-media">
    <video *ngIf="isVideo(postResponse.mediaLink)" [src]="postResponse.mediaLink" controls class="post-video"></video>
    <img *ngIf="!isVideo(postResponse.mediaLink)" [src]="postResponse.mediaLink" [alt]="postResponse.title"
      class="post-image">
  </div>

  <!-- Post footer with engagement stats -->
  <app-likes entityType="post" [entityId]="postResponse.id" [likesCount]="postResponse.likesCount"
    [dislikesCount]="postResponse.dislikesCount" [userReaction]="postResponse.userReaction ?? undefined"></app-likes>

  <app-comments [postId]="postResponse.id" [commentsCount]="postResponse.commentsCount">
  </app-comments>

</div>
