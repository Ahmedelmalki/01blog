<!-- Feed Container -->
<div class="feed-container">
  
  <!-- Header with create post and logout buttons -->
  <div class="feed-header">
    <h1>Feed</h1>
    <div class="header-actions">
      <button class="create-btn" routerLink="/post/create">+ Create Post</button>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <!-- Loading spinner while fetching posts -->
  <div *ngIf="isLoading" class="loading">
    <p>Loading posts...</p>
  </div>

  <!-- Error message if API call fails -->
  <div *ngIf="errorMessage" class="error">
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Display posts if loaded successfully -->
  <div *ngIf="!isLoading && !errorMessage" class="posts-list">
    
    <!-- Message if no posts exist -->
    <div *ngIf="posts.length === 0" class="no-posts">
      <p>No posts yet. Be the first to post!</p>
    </div>

    <!-- Loop through each post and render PostCardComponent -->
    <app-post-card 
      *ngFor="let post of posts" 
      [postResponse]="post"
    ></app-post-card>
  </div>
</div>
