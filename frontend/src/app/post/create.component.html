<div class="create-container">
  
  <div class="create-header">
    <h1>{{ isEditMode ? 'Edit Post' : 'Create New Post' }}</h1>
    <button class="back-btn" (click)="cancel()">← Cancel</button>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" class="create-form">
    
    <div class="form-group">
      <label for="title">Title *</label>
      <input 
        type="text" 
        id="title" 
        name="title" 
        [(ngModel)]="post.title" 
        placeholder="Enter post title"
        required
        [disabled]="isLoading || isUploading"
      >
    </div>

    <div class="form-group">
      <label for="content">Content *</label>
      <textarea 
        id="content" 
        name="content" 
        [(ngModel)]="post.content" 
        placeholder="What's on your mind?"
        rows="8"
        required
        [disabled]="isLoading || isUploading"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="media">Media (Image/Video)</label>
      <input 
        type="file" 
        id="media" 
        (change)="ifFileSelected($event)"
        accept="image/*,video/*"
        [disabled]="isLoading || isUploading"
      >
      <small *ngIf="selectedFile">Selected: {{ selectedFile.name }}</small>
      <small *ngIf="post.mediaLink && !selectedFile" class="current-media">
        Current media: {{ post.mediaLink }}
      </small>
    </div>

    <div class="form-actions">
      <button 
        type="button" 
        class="cancel-btn" 
        (click)="cancel()"
        [disabled]="isLoading || isUploading"
      >
        Cancel
      </button>
      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading || isUploading || !post.title.trim() || !post.content.trim()"
      >
        <span *ngIf="!isLoading && !isUploading">
          {{ isEditMode ? '✓ Update Post' : '+ Create Post' }}
        </span>
        <span *ngIf="isUploading">Uploading file...</span>
        <span *ngIf="isLoading && !isUploading">
          {{ isEditMode ? 'Updating...' : 'Creating...' }}
        </span>
      </button>
    </div>

  </form>

</div>
