# ===============================
# APP INFO
# ===============================
spring.application.name=demo

# ===============================
# DATASOURCE CONFIG
# ===============================
# These allow overriding via environment variables (great for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0000}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ===============================
# JPA / HIBERNATE
# ===============================
# Automatically create tables if missing but don't drop them each run
spring.jpa.hibernate.ddl-auto=update

# don't show SQL queries in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Show only your app logs
logging.level.com.example.demo=INFO

# ===============================
# SERVER CONFIG
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# ERROR HANDLING (for debugging 500 errors)
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ===============================
# JWT
# ===============================
jwt.secret=myVerySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
file.upload-dir=${FILE_UPLOAD_DIR:/home/allal/01blog/backend/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
