version: "3.8"
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: 01blogdb
      MYSQL_USER: 01blog
      MYSQL_PASSWORD: 01blogpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      retries: 10
    ports:
      - "3306:3306"

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/01blogdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: 01blog
      SPRING_DATASOURCE_PASSWORD: 01blogpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: /app/uploads 
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads  

volumes:
  db_data:
